    <circle cx="24" cy="24" r="8" fill="none" stroke="#FF4D00" stroke-width="2"/>
    <circle cx="24" cy="24" r="2" fill="#FF4D00"/>
  </g>
  <text x="148" y="115" fill="#FFFFFF" font-family="Space Grotesk, sans-serif" font-size="36" font-weight="900" letter-spacing="-1">COROBOTX</text>

  <text x="80" y="320" fill="#F0DFDA" font-family="Space Grotesk, sans-serif" font-size="84" font-weight="800" letter-spacing="-2">Precision Powered</text>
  <text x="80" y="410" fill="#FF4D00" font-family="Space Grotesk, sans-serif" font-size="84" font-weight="800" letter-spacing="-2">Automation.</text>

  <text x="80" y="475" fill="#94A3B8" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="500">Industrial Robotics · Automation · EMS · BMS</text>

  <g transform="translate(80, 530)">
